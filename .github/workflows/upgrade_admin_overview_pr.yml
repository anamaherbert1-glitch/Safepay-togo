name: Upgrade Admin Overview PR

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

# One-off migration helper for the Admin Overview.
jobs:
  upgrade:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Update AdminDashboardLegacy overview
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('app/admin/AdminDashboardLegacy.tsx')
          s = p.read_text(encoding='utf-8')
          old = 'const [analytics, setAnalytics] = useState<Row[]>([]); const [days, setDays] = useState(30); const [loading, setLoading] = useState(true);'
          new = 'const [analytics, setAnalytics] = useState<Row[]>([]); const [days, setDays] = useState(30); const [endDate, setEndDate] = useState(() => new Date().toISOString().slice(0, 10)); const [startDate, setStartDate] = useState(() => new Date(Date.now() - 29 * 86400000).toISOString().slice(0, 10)); const [loading, setLoading] = useState(true);'
          assert old in s, 'state anchor missing'
          s = s.replace(old, new, 1)
          s = s.replace('s.rpc("admin_analytics_timeseries", { p_days: 30 })', 's.rpc("admin_overview_timeseries", { p_start_date: startDate, p_end_date: endDate })', 1)
          s = s.replace('useEffect(() => { if (!loading && (active === "revenue" || active === "overview")) loadRevenue(); }, [days, loading, active]);', 'useEffect(() => { if (!loading && (active === "revenue" || active === "overview")) loadRevenue(); }, [startDate, endDate, loading, active]);', 1)
          s = s.replace('async function loadRevenue() { const r = await createClient().rpc("admin_analytics_timeseries", { p_days: days }); if (r.error) setError(r.error.message); else setAnalytics(Array.isArray(r.data) ? r.data : []); }', 'async function loadRevenue() { const r = await createClient().rpc("admin_overview_timeseries", { p_start_date: startDate, p_end_date: endDate }); if (r.error) setError(r.error.message); else setAnalytics(Array.isArray(r.data) ? r.data : []); }', 1)
          s = s.replace('createClient().rpc("admin_analytics_timeseries", { p_days: days })', 'createClient().rpc("admin_overview_timeseries", { p_start_date: startDate, p_end_date: endDate })', 1)
          s = s.replace('<Overview summary={summary} analytics={analytics} days={days} setDays={setDays} navigate={navigate}/>', '<Overview summary={summary} analytics={analytics} startDate={startDate} endDate={endDate} setStartDate={setStartDate} setEndDate={setEndDate} setDays={setDays} navigate={navigate}/>', 1)
          overview_re = re.compile(r'function Overview\(\{ summary, analytics, days, setDays, navigate \}: \{.*?\n\}\n\nfunction Health', re.S)
          overview = '''function Overview({ summary, analytics, startDate, endDate, setStartDate, setEndDate, setDays, navigate }: { summary: Row; analytics: Row[]; startDate: string; endDate: string; setStartDate: (v: string) => void; setEndDate: (v: string) => void; setDays: (n: number) => void; navigate: (m: Module) => void }) {
  const cards = [["Utilisateurs", summary.users_total ?? 0, "Total", "users"], ["Volume transactions", money(summary.transactions_volume_total), "Réussies", "transactions"], ["Argent disponible", money(summary.wallets_total_balance), "Wallets", "wallets"], ["Argent bloqué", money(summary.wallets_total_locked), "Escrow", "ledger"], ["Dépôts", money(summary.deposits_volume_successful), "Réussis", "deposits"], ["Retraits", money(summary.withdrawals_volume_successful), "Réussis", "withdrawals"], ["Commissions", money(summary.commission_revenue_total), "Revenus SafePay", "revenue"], ["Litiges", summary.disputes_open ?? 0, "Ouverts", "disputes"]];
  const applyPreset = (n: number) => { const end = new Date().toISOString().slice(0, 10); const start = new Date(Date.now() - (n - 1) * 86400000).toISOString().slice(0, 10); setStartDate(start); setEndDate(end); setDays(n); };
  const validRange = startDate <= endDate;
  return <div className="adm-overview"><section className="adm-hero"><div><span>TABLEAU DE BORD</span><h2>Bonjour, administrateur.</h2><p>Une vue unifiée des opérations SafePay, alimentée par le backend réel.</p></div><div className="adm-hero-status"><i/> Système opérationnel</div></section><section className="adm-kpis">{cards.map(([label, val, sub, target]: any) => <button key={label} className="adm-kpi" onClick={() => navigate(target)}><div className="adm-kpi-top"><span>{label}</span><Icon name={target}/></div><strong>{typeof val === "number" ? val.toLocaleString("fr-FR") : val}</strong><small>{sub}</small><em><Icon name="arrow" size={14}/></em></button>)}</section><section className="adm-panel adm-chart"><div className="adm-panel-head"><div><span>ANALYTICS</span><h3>Trafic et activité SafePay</h3><p style={{margin: "5px 0 0", opacity: .62}}>Volume, dépôts, retraits et soldes sur la période sélectionnée.</p></div><div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center",justifyContent:"flex-end"}}><button className="ghost" onClick={() => applyPreset(7)}>7j</button><button className="ghost" onClick={() => applyPreset(30)}>30j</button><button className="ghost" onClick={() => applyPreset(90)}>90j</button><button className="ghost" onClick={() => applyPreset(365)}>12m</button></div></div><div style={{display:"flex",gap:12,alignItems:"center",flexWrap:"wrap",padding:"14px 0 18px"}}><label style={{display:"grid",gap:5,fontSize:12,opacity:.85}}><span>DU</span><input type="date" value={startDate} max={endDate} onChange={e => setStartDate(e.target.value)} style={{minHeight:40,padding:"0 10px",borderRadius:10}} /></label><span style={{opacity:.5,marginTop:18}}>→</span><label style={{display:"grid",gap:5,fontSize:12,opacity:.85}}><span>AU</span><input type="date" value={endDate} min={startDate} max={new Date().toISOString().slice(0,10)} onChange={e => setEndDate(e.target.value)} style={{minHeight:40,padding:"0 10px",borderRadius:10}} /></label>{!validRange && <b style={{color:"#ff6b7a",fontSize:12}}>Période invalide</b>}<span style={{marginLeft:"auto",fontSize:12,opacity:.58}}>{startDate} → {endDate}</span></div><LineChart data={analytics}/></section><section className="adm-panel"><div className="adm-panel-head"><div><span>SURVEILLANCE</span><h3>Indicateurs SafePay</h3></div></div><Health summary={summary}/></section><section className="adm-panel"><div className="adm-panel-head"><div><span>ACCÈS RAPIDE</span><h3>Actions opérationnelles</h3></div></div><div className="adm-quick">{[["kyc","KYC","Vérifier les dossiers"],["withdrawals","Retraits","Traiter les payouts"],["disputes","Litiges","Gérer l'escrow"],["support","Support","Répondre aux clients"],["settings","Paramètres","Modifier les règles"],["audit","Audit logs","Tracer les actions"]].map(([k,l,d]) => <button key={k} onClick={() => navigate(k as Module)}><Icon name={k}/><div><b>{l}</b><small>{d}</small></div><Icon name="arrow" size={15}/></button>)}</div></section></div>;
}

function Health'''
          s, n = overview_re.subn(overview, s, count=1)
          assert n == 1, 'overview block not replaced'
          chart_re = re.compile(r'function MiniChart\(\{ data \}: \{ data: Row\[\] \}\) \{.*?\n\}', re.S)
          chart = '''function LineChart({ data }: { data: Row[] }) {
  if (!data.length) return <div className="adm-empty-chart">Aucune donnée pour la période sélectionnée.</div>;
  const series = [{key:"transaction_volume",label:"Transactions"},{key:"deposits",label:"Dépôts"},{key:"withdrawals",label:"Retraits"},{key:"available_balance",label:"Disponible"},{key:"locked_balance",label:"Bloqué"}];
  const W=1000,H=300,P=42; const maxes=Object.fromEntries(series.map(s=>[s.key,Math.max(1,...data.map(d=>Number(d[s.key]??0)))]));
  const point=(i:number,key:string)=>{const x=P+(i/(Math.max(1,data.length-1)))*(W-P*2); const y=H-P-(Number(data[i][key]??0)/maxes[key])*(H-P*2); return `${x},${y}`};
  return <div style={{width:"100%",overflowX:"auto"}}><div style={{minWidth:Math.min(1000,Math.max(620,data.length*24))}}><svg viewBox={`0 0 ${W} ${H}`} width="100%" height="300" role="img" aria-label="Courbes analytics SafePay"><line x1={P} y1={H-P} x2={W-P} y2={H-P} stroke="currentColor" opacity=".16"/><line x1={P} y1={P} x2={P} y2={H-P} stroke="currentColor" opacity=".16"/>{[0,1,2,3,4].map(i=><line key={i} x1={P} y1={P+i*(H-2*P)/4} x2={W-P} y2={P+i*(H-2*P)/4} stroke="currentColor" opacity=".07"/>)}{series.map(s=><polyline key={s.key} fill="none" stroke="currentColor" strokeWidth="2.5" opacity={s.key==="transaction_volume"?1:.52} points={data.map((_,i)=>point(i,s.key)).join(" ")}/>)}{data.map((d,i)=><g key={String(d.date)}>{series.map(s=>{const [x,y]=point(i,s.key).split(","); return <circle key={s.key} cx={x} cy={y} r="3" fill="currentColor" opacity={s.key==="transaction_volume"?1:.58}><title>{`${s.label} · ${String(d.date)} · ${money(d[s.key])}`}</title></circle>})}</g>)}{[0,Math.floor((data.length-1)/2),data.length-1].filter((v,i,a)=>a.indexOf(v)===i).map(i=><text key={i} x={P+(i/(Math.max(1,data.length-1)))*(W-P*2)} y={H-12} textAnchor="middle" fontSize="11" fill="currentColor" opacity=".58">{String(data[i].date).slice(5)}</text>)}</svg><div style={{display:"flex",gap:18,flexWrap:"wrap",paddingTop:8,fontSize:12,opacity:.72}}>{series.map(s=><span key={s.key} style={{display:"inline-flex",alignItems:"center",gap:6}}><i style={{width:20,height:2,background:"currentColor",display:"inline-block",opacity:s.key==="transaction_volume"?1:.52}}/>{s.label}</span>)}</div></div></div>;
}'''
          s, n = chart_re.subn(chart, s, count=1)
          assert n == 1, 'chart block not replaced'
          p.write_text(s, encoding='utf-8')
      - name: Commit updated dashboard
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/AdminDashboardLegacy.tsx
          git diff --cached --quiet || git commit -m "feat(admin): add overview date-range analytics"
          git push origin HEAD:${{ github.head_ref }}
